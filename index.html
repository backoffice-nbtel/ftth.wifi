<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طلب اجازة - قسم الــ Back Office</title>
<style>
:root{--bg:#f3f3f3;--card:#fff;--tx:#222;--mu:#6d6d6d;--ac:#f26a0b;--ac2:#ff5a00;--bd:#e0e0e0;--hdr:#fff;--hdrtx:#222}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1d1d1d;--tx:#eee;--mu:#a0a0a0;--bd:#333;--hdr:#000;--hdrtx:#fff}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,sans-serif;line-height:1.6}
header{background:var(--hdr);padding:16px 16px 12px;text-align:center;border-bottom:4px solid var(--ac)}
.brand{direction:ltr;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.brand .ic{width:64px;height:auto;display:block}
.brand .wm{height:38px;width:auto;display:block}
.brand .wm.d{display:none}
@media (prefers-color-scheme:dark){.brand .wm.l{display:none}.brand .wm.d{display:block}}
header h1{margin:10px 0 0;font-size:18px;color:var(--hdrtx);font-weight:bold}
main{max-width:600px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.row{display:flex;gap:8px}.row>div{flex:1}
.btn{padding:12px 16px;border:0;border-radius:10px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font:inherit;font-weight:bold;margin-top:14px;width:100%;cursor:pointer}
.btn:disabled{opacity:.6}
.tag{padding:2px 10px;border-radius:99px;font-size:12px;color:#fff}
.p{background:#c48a1a}.a{background:#1f7a5a}.r{background:#b23b3b}.mu{color:var(--mu);font-size:13px}.hd{display:flex;justify-content:space-between}
.hid{display:none}
.tot{margin-top:10px;padding:8px 12px;border-radius:8px;background:var(--bg);border:1px dashed var(--ac);font-weight:bold}
.sm{width:auto;padding:6px 16px;margin-top:8px;background:#b23b3b;font-size:13px}
.w{background:#6d6d6d}
.warn{border-color:#b23b3b;line-height:1.9}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.dh{text-align:center;font-weight:bold;color:var(--ac);margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--ac)}
.nm{display:block;width:100%;margin-bottom:6px;padding:10px 4px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.nm.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
optgroup{font-style:normal;font-weight:bold}
</style>
</head>

<script>
// ===== رابط Google Apps Script =====
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbzAxQ3uxoEFgDOuakj4Dp84YzZfYm9ajT6cquiunz8JtP6OlHqfYPDXzSZ3LiCHc6Kd/exec";
// ===== قائمة الموظفين (نفس الأسماء في كود الإكسل) =====
var DEPTS=[
  {n:"FTTH",l:["دينا خالد","مصطفى علي","عبدالرحمن مهند","طه عدنان","وليد خالد","علي غربي","نمير عماد","غفران مهند"]},
  {n:"WIFI",l:["احمد ميسر","شمس مزاحم"]}
];
var TYPES=["اعتيادية","مرضية","طارئة","زمنية","بدون راتب","سفر","تبديل شفت","ريمونتلي"];
// أوقات الشيفت الجاهزة (عدّلها حسب دوامكم)
// جدول الدوام يُقرأ من شيت «جدول الدوام» في الإكسل ويصل مع بيانات الموظف بعد الدخول
function t12(x){var p=x.split(":"),n=+p[0];return (n%12||12)+(p[1]!="00"?":"+p[1]:"")+" "+(n>=12?"م":"ص")}
function lbl(c){if(c=="O")return "عطلة";if(c=="W")return "غير محدد";var p=c.split(" - ");return t12(p[0])+" - "+t12(p[1])}
function dayCode(n,ds){
  var sc=me&&me.data&&me.data.sched;if(!sc)return "W";
  var p=ds.split("-"),a=sc.anchor.split("-"),diff=Math.round((Date.UTC(+p[0],+p[1]-1,+p[2])-Date.UTC(+a[0],+a[1]-1,+a[2]))/864e5);
  var d=((diff%7)+7)%7,wk=((Math.floor(diff/7)%2)+2)%2,e=sc.days[n];
  return e?e[wk][d]:"W";
}
function workDays(n,f,e){
  var p=f.split("-"),t=Date.UTC(+p[0],+p[1]-1,+p[2]),q=e.split("-"),end=Date.UTC(+q[0],+q[1]-1,+q[2]),c=0;
  for(var i=0;t<=end&&i<400;i++,t+=864e5){if(dayCode(n,new Date(t).toISOString().slice(0,10))!="O")c++}
  return c;
}
function shiftOpts(){var l=(me.data.sched&&me.data.sched.shifts)||[];return l.map(function(s){return '<option value="'+s+'">'+lbl(s)+' ('+s+')</option>'}).join("")}
// ===================================
var me=null,tabN=1,pendingName="";
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ls(k,v){try{if(v!==undefined)localStorage.setItem(k,v);return localStorage.getItem(k)||""}catch(e){return ""}}
function show(id,on){$(id).classList.toggle("hid",!on)}
function hrs(a,b){if(!a||!b)return 0;var x=a.split(":"),y=b.split(":"),d=(+y[0])*60+(+y[1])-(+x[0])*60-(+x[1]);if(d<0)d+=1440;return d/60}
function fmtH(h){var m=Math.round(h*60),a=Math.floor(m/60),b=m%60;return (a?a+" ساعة":"")+(a&&b?" و ":"")+(b?b+" دقيقة":"")||"0"}
function deptOf(n){for(var i=0;i<DEPTS.length;i++)if(DEPTS[i].l.indexOf(n)>-1)return DEPTS[i].n;return ""}
function nameGrid(sel){
  return '<div class="cols">'+DEPTS.map(function(d){
    return '<div><div class="dh">'+d.n+'</div><select class="dd" onchange="dd(this)"><option value="">اختر الاسم</option>'+d.l.map(function(x){return '<option'+(x==sel?' selected':'')+'>'+esc(x)+'</option>'}).join("")+'</select></div>';
  }).join("")+'</div>';
}
function dd(el){
  document.querySelectorAll(".dd").forEach(function(s){if(s!==el)s.value=""});
  pickName(el.value);
}
function subOptions(f){
  var d=deptOf(me.name),list=[];
  DEPTS.forEach(function(x){if(x.n==d)list=x.l.filter(function(n){return n!=me.name})});
  return '<option value="">اختر الموظف البديل</option>'+list.map(function(x){
    var c=f?dayCode(x,f):"";return '<option value="'+esc(x)+'">'+esc(x)+(c?' — '+lbl(c):'')+'</option>';
  }).join("");
}
function pinKey(ev,id){
  if(ev.key!=="Enter")return;ev.preventDefault();
  if(id=="pw"&&$("pw2"))$("pw2").focus();else $("lb").click();
}
function pinInput(id){return '<input id="'+id+'" onkeydown="pinKey(event,\''+id+'\')" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" style="text-align:center;letter-spacing:6px;font-size:18px">'}
function why(x){return "تعذر الاتصال بالسيرفر: "+String(x&&x.message||x)+". تأكد من الإنترنت ومن أن نشر السكربت (الوصول = أي شخص) محدّث."}
async function api(b){
  var t=await (await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)})).text(),j;
  try{j=JSON.parse(t)}catch(e){throw new Error("الرابط يرجع صفحة بدل البيانات")}
  return j;
}
function tab(n){tabN=n;$("t1").className=n==1?"on":"";$("t2").className=n==2?"on":"";render()}
function render(){if(!me){loginView();return}tabN==1?form():mine()}

/* ---------- الدخول ---------- */
function loginView(msg){
  $("v").innerHTML=(msg?'<div class="card">'+msg+'</div>':'')+'<div class="card"><label>اختر اسمك</label>'+nameGrid(pendingName)+'<div id="au"></div></div>';
  if(pendingName)pickName(pendingName);
}
async function pickName(n){
  pendingName=n;
  if(!n){$("au").innerHTML="";return}
  $("au").innerHTML='<div class="mu" style="margin-top:10px">جاري التحقق...</div>';
  try{
    var j=await api({action:"status",name:n});
    if(pendingName!=n)return;
    if(!j.ok||typeof j.hasPin==="undefined"){$("au").innerHTML='<div class="card warn" style="margin-top:10px;color:#b23b3b">'+esc(j.error||"الرابط ما زال يعمل بالنسخة القديمة من كود الإكسل. افتح Apps Script ← نشر ← إدارة عمليات النشر ← تعديل ← إصدار جديد ← نشر.")+'</div>';return}
    $("au").innerHTML=j.hasPin
      ?'<label>كلمة السر (5 أرقام)</label>'+pinInput("pw")+'<button class="btn" id="lb" onclick="doLogin()">دخول</button>'
      :'<div class="mu" style="margin-top:10px">أول مرة تختار فيها اسمك: أنشئ كلمة سر من 5 أرقام. ستحتاجها كل مرة تدخل فيها لتقديم طلب أو لمعرفة رصيدك.</div><label>كلمة سر جديدة (5 أرقام)</label>'+pinInput("pw")+'<label>أعد كتابتها</label>'+pinInput("pw2")+'<button class="btn" id="lb" onclick="doSetPin()">حفظ كلمة السر والدخول</button>';
  }catch(x){$("au").innerHTML='<div class="mu" style="margin-top:10px">'+esc(why(x))+'</div>'}
}
async function doLogin(){
  var n=pendingName,p=$("pw").value.trim();
  if(!/^\d{5}$/.test(p))return alert("كلمة السر مكوّنة من 5 أرقام فقط");
  $("lb").disabled=true;
  try{
    var j=await api({action:"login",name:n,pin:p});
    if(!j.ok){alert(j.error);$("lb").disabled=false;return}
    me={name:n,pin:p,data:j};tab(tabN);
  }catch(x){alert(why(x));$("lb").disabled=false}
}
async function doSetPin(){
  var n=pendingName,p=$("pw").value.trim(),p2=$("pw2").value.trim();
  if(!/^\d{5}$/.test(p))return alert("كلمة السر يجب أن تكون 5 أرقام فقط");
  if(p!=p2)return alert("كلمتا السر غير متطابقتين");
  $("lb").disabled=true;
  try{
    var j=await api({action:"setpin",name:n,pin:p});
    if(!j.ok){alert(j.error);$("lb").disabled=false;return}
    me={name:n,pin:p,data:j};tab(tabN);
  }catch(x){alert(why(x));$("lb").disabled=false}
}
function logout(){me=null;pendingName="";loginView()}
function userBar(){
  var d=me.data;
  return '<div class="card mu" style="display:flex;justify-content:space-between;align-items:center"><span><b style="color:var(--tx)">'+esc(me.name)+'</b> • '+esc(d.dept)+'<br>المتبقي من رصيدك: <b style="color:var(--tx)">'+d.remaining+'</b> من '+d.quota+' يوم</span><a href="#" onclick="logout();return false" style="color:var(--ac)">تغيير الموظف</a></div>';
}

/* ---------- طلب جديد ---------- */
function form(msg){
  var t=new Date().toISOString().slice(0,10);
  $("v").innerHTML=(msg?'<div class="card">'+msg+'</div>':'')+userBar()+
  '<div class="card"><label>رقم الهاتف</label><input id="p" inputmode="tel" placeholder="07XXXXXXXXX" value="'+esc(ls("ph_"+me.name))+'">'+
  '<label>نوع الإجازة</label><select id="ty" onchange="tch(1)">'+TYPES.map(function(x){return "<option>"+x+"</option>"}).join("")+'</select>'+
  '<div id="rw" class="hid"><label>نوع الريمونتلي</label><select id="rm" onchange="tch()"><option>كامل</option><option>جزئي</option></select></div>'+
  '<div class="row"><div><label id="lf">من</label><input type="date" id="f" value="'+t+'" oninput="tch(1)"></div><div id="ew"><label>إلى</label><input type="date" id="e" value="'+t+'" oninput="tch()"></div></div>'+
  '<div id="dn" class="mu" style="margin-top:6px"></div>'+
  '<div class="row hid" id="tw"><div><label>من الساعة</label><input type="time" id="ft" value="09:00" oninput="tch()"></div><div><label>إلى الساعة</label><input type="time" id="tt" value="11:00" oninput="tch()"></div></div>'+
  '<div id="tot" class="tot hid"></div>'+
  '<div id="sw" class="hid"><label>الموظف البديل</label><select id="sb">'+subOptions("")+'</select><label>وقت الشيفت</label><select id="sh" onchange="tch()">'+shiftOpts()+'<option value="other">وقت آخر...</option></select>'+
  '<div class="row hid" id="sc"><div><label>من الساعة</label><input type="time" id="sf" value="08:00"></div><div><label>إلى الساعة</label><input type="time" id="st" value="16:00"></div></div></div>'+
  '<label>السبب</label><textarea id="r" rows="3"></textarea><button class="btn" id="sb2" onclick="send()">إرسال الطلب إلى المدير</button></div>';
  tch();
}
function tch(auto){
  var ty=$("ty").value,rmt=ty=="ريمونتلي",part=rmt&&$("rm").value=="جزئي",z=ty=="زمنية",sw=ty=="تبديل شفت";
  var one=z||sw||part,time=z||part;
  show("rw",rmt);show("sw",sw);show("tw",time);show("ew",!one);show("sc",sw&&$("sh").value=="other");
  $("lf").textContent=one?"التاريخ":"من";
  if(time){
    var h=hrs($("ft").value,$("tt").value);
    $("tot").textContent=(z?"مدة الإجازة الزمنية: ":"مجموع الريمونتلي الجزئي: ")+(h>0?fmtH(h)+($("tt").value<$("ft").value?" (ينتهي بعد منتصف الليل)":""):"— (وقت البداية والنهاية متطابقان)");
  }
  show("tot",time);
  var f=$("f").value,e=$("e").value,note="";
  if(f){
    if(one){var c=dayCode(me.name,f);note=c=="O"?"هذا اليوم عطلتك الأسبوعية":c=="W"?"لم يُحدَّد دوامك لهذا اليوم":"دوامك في هذا اليوم: "+lbl(c);}
    else if(e&&e>=f){note="عدد أيام الإجازة: "+workDays(me.name,f,e)+" (بعد استثناء عطلتك الأسبوعية)";}
  }
  $("dn").textContent=note;
  if(sw){
    var cur=$("sb").value;$("sb").innerHTML=subOptions(f);$("sb").value=cur;
    if(auto&&f){var c2=dayCode(me.name,f);if(c2!="O"&&c2!="W"){$("sh").value=c2;show("sc",false)}}
  }
}
async function send(){
  var ty=$("ty").value,rm=$("rm").value,p=$("p").value.trim(),f=$("f").value;
  var o={action:"submit",name:me.name,pin:me.pin,phone:p,type:ty,from:f,to:f,fromTime:"",toTime:"",sub:"",shift:"",remote:"",reason:$("r").value.trim()};
  if(p.replace(/\D/g,"").length<6)return alert("يرجى إدخال رقم الهاتف");
  if(!f)return alert("حدد التاريخ");
  if(ty=="زمنية"||(ty=="ريمونتلي"&&rm=="جزئي")){
    o.fromTime=$("ft").value;o.toTime=$("tt").value;
    if(!o.fromTime||!o.toTime)return alert("حدد الوقت من الساعة إلى الساعة");
    if(hrs(o.fromTime,o.toTime)<=0)return alert("وقت البداية والنهاية متطابقان");
  }else if(ty=="تبديل شفت"){
    o.sub=$("sb").value;if(!o.sub)return alert("اختر الموظف البديل");
    if($("sh").value=="other"){if(!$("sf").value||!$("st").value)return alert("حدد وقت الشيفت");o.shift=$("sf").value+" - "+$("st").value}
    else o.shift=$("sh").value;
  }else{
    var e=$("e").value;if(!e||e<f)return alert("تاريخ النهاية قبل البداية");o.to=e;
  }
  if(ty=="ريمونتلي")o.remote=rm;
  $("sb2").disabled=true;$("sb2").textContent="جاري الإرسال...";
  try{
    var j=await api(o);
    if(!j.ok){alert(j.error);$("sb2").disabled=false;$("sb2").textContent="إرسال الطلب إلى المدير";return}
    ls("ph_"+me.name,p);me.data=j;
    if(j.autoRejected){
      var c=j.conflict,dd=c.start==c.end?"يوم "+c.start:"الفترة من "+c.start+" إلى "+c.end;
      form('<div class="warn" style="color:#b23b3b"><b>تعذّر قبول طلبك.</b><br>سبق للموظف «'+esc(c.name)+'» أن قدّم طلب إجازة في '+esc(dd)+'، ولذلك رُفض طلبك تلقائياً.<br>يمكنك التواصل مع «'+esc(c.name)+'» للاتفاق معه، وإذا سحب طلبه فيمكنك حينها تقديم طلبك من جديد.</div>');
      return;
    }
    form('✅ تم إرسال طلبك إلى المدير. تابع حالته من تبويب «طلباتي».');
  }catch(x){alert(why(x));$("sb2").disabled=false;$("sb2").textContent="إرسال الطلب إلى المدير"}
}

/* ---------- طلباتي ---------- */
async function wd(id){
  if(!confirm("هل أنت متأكد من سحب هذا الطلب؟"))return;
  try{
    var j=await api({action:"withdraw",name:me.name,pin:me.pin,id:id});
    if(!j.ok){alert(j.error);return}
    me.data=j;mine();
  }catch(x){alert(why(x))}
}
function dur(l){
  var h=Number(l.hours)||0;
  if(l.type=="زمنية")return l.from+" من الساعة "+l.fromTime+" إلى "+l.toTime+" ("+fmtH(h)+")";
  if(l.type=="ريمونتلي"&&l.remote=="جزئي")return "ريمونتلي جزئي: "+l.from+" من الساعة "+l.fromTime+" إلى "+l.toTime+" (المجموع "+fmtH(h)+")";
  if(l.type=="ريمونتلي")return "ريمونتلي كامل: من "+l.from+" إلى "+l.to+" ("+l.days+" يوم)";
  if(l.type=="تبديل شفت")return l.from+" • الشيفت: "+l.shift+" • البديل: "+l.sub;
  return "من "+l.from+" إلى "+l.to+" ("+l.days+" يوم)";
}
async function mine(){
  $("v").innerHTML='<div class="card mu">جاري التحميل...</div>';
  try{
    var j=await api({action:"login",name:me.name,pin:me.pin});
    if(!j.ok){alert(j.error);logout();return}
    me.data=j;
    var today=new Date().toISOString().slice(0,10);
    var m={"موافق":"a","مرفوض":"r","مسحوب":"w"},extra=[];
    if(j.remoteDays||j.remoteHours)extra.push("ريمونتلي معتمد: "+j.remoteDays+" يوم + "+fmtH(j.remoteHours));
    if(j.swaps)extra.push("تبديل شفت معتمد: "+j.swaps+" مرة");
    if(j.pending)extra.push("طلبات بانتظار الرد: "+j.pending);
    $("v").innerHTML=userBar()+'<div class="card"><b>رصيدك لسنة '+j.year+'</b><div class="mu">الرصيد: '+j.quota+' يوم • المستخدم: '+j.used+' • المتبقي: '+j.remaining+'</div>'+(extra.length?'<div class="mu">'+extra.join(' • ')+'</div>':'')+'</div>'+
    (j.rows.length?j.rows.map(function(l){return '<div class="card"><div class="hd"><b>'+esc(l.type)+'</b><span class="tag '+(m[l.status]||"p")+'">'+esc(l.status)+'</span></div><div class="mu">'+esc(dur(l))+'</div>'+(l.reason?'<div>'+esc(l.reason)+'</div>':'')+(l.note?'<div class="mu">ملاحظة: '+esc(l.note)+'</div>':'')+((l.status=="قيد الانتظار"||l.status=="موافق")&&l.to>=today?'<button class="btn sm" onclick="wd(\''+esc(l.id)+'\')">سحب الطلب</button>':'')+'</div>'}).join(""):'<div class="card mu">لا توجد طلبات بعد.</div>');
  }catch(x){$("v").innerHTML='<div class="card mu">تعذر تحميل الطلبات. '+esc(why(x))+'</div>'}
}
loginView();
</script>
